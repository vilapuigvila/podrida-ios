name: Podrida
options:
  bundleIdPrefix: com.albertvila
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Podrida:
    type: application
    platform: iOS
    sources:
      - path: Podrida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertvila.podrida
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HL99S7U2Q3
    info:
      path: Podrida/Info.plist
      properties:
        CFBundleDisplayName: Podrida
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  PodridaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PodridaTests
    dependencies:
      - target: Podrida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertvila.podrida.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Podrida:
    build:
      targets:
        Podrida: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PodridaTests
