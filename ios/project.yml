name: Podrida
options:
  bundleIdPrefix: com.pskmoons
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.6.1
targets:
  Podrida:
    type: application
    platform: iOS
    sources:
      - path: Podrida
    dependencies:
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pskmoons.podrida
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HL99S7U2Q3
    info:
      path: Podrida/Info.plist
      properties:
        CFBundleDisplayName: Podrida
        # Read from the settings above, so a version bump there reaches the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  PodridaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PodridaTests
    dependencies:
      - target: Podrida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pskmoons.podrida.tests
        GENERATE_INFOPLIST_FILE: YES
  PodridaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PodridaUITests
    dependencies:
      - target: Podrida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pskmoons.podrida.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Podrida
schemes:
  Podrida:
    build:
      targets:
        Podrida: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PodridaTests
        - PodridaUITests
