name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # App Store Connect now rejects uploads built with an older SDK than the one the
      # runner defaults to (a run on 2026-09-26 failed: "built with the iOS 18.5 SDK...
      # must be built with the iOS 26 SDK or later"). Pick the newest non-beta Xcode the
      # runner has instead of trusting its default.
      - name: Select latest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Ships a new marketing version every run (1.0.0 -> 1.0.1 -> ...). The build number
      # itself isn't bumped here: manageAppVersionAndBuildNumber in ExportOptions.plist has
      # xcodebuild ask App Store Connect for the next one during export.
      - name: Bump marketing version
        id: bump
        run: |
          new_version=$(python3 ios/tools/bump_marketing_version.py)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumping marketing version to $new_version"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Commit and tag the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/project.yml ios/Podrida.xcodeproj/project.pbxproj
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/Podrida.xcodeproj -scheme Podrida -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Podrida.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Podrida.xcarchive" \
            -exportOptionsPlist ios/AppStore/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs
          path: |
            ${{ runner.temp }}/export
