name: iOS tests

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A closed pull request that wasn't merged doesn't run the tests.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit on main; empty on a manual run, which checks out the chosen branch.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Boot an iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in ios for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Build for testing
        timeout-minutes: 20
        run: |
          xcodebuild build-for-testing \
            -project ios/Podrida.xcodeproj -scheme Podrida \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Podrida/|\*\* BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log

      - name: Run unit and UI tests
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building \
            -project ios/Podrida.xcodeproj -scheme Podrida \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            2>&1 | tee test.log

      - name: Upload logs and results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build.log
            test.log
            TestResults.xcresult
